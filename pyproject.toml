[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "skincare-advisor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.3.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
    "langsmith>=0.1.0",
    "openai>=1.30.0",
    "pandas>=2.2.0",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "streamlit>=1.35.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "config*", "graph*", "services*", "tools*", "utils*"]

[tool.setuptools]
py-modules = ["schemas", "db"]
