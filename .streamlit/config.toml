[theme]
primaryColor = "#A8C3BC"
backgroundColor = "#FFF3EC"
secondaryBackgroundColor = "#FBE4DF"
textColor = "#3A3A3A"
font = "sans serif"

[server]
runOnSave = true
# "poll" skips walking every installed package's __path__, which made the
# dev console spam ModuleNotFoundError tracebacks for transformers image
# processors whose torchvision dependency is not installed.
fileWatcherType = "poll"
